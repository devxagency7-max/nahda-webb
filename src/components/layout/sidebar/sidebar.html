<aside class="sidebar sidebar--collapsed" aria-label="شريط التنقل الجانبي">
  <div class="sidebar__header">
    <div class="sidebar__brand">
      <div class="sidebar__logo">
        <img src="assets/logo.png" alt="منظومة النهضة" class="sidebar__logo-img">
      </div>
      <div class="sidebar__title-wrapper">
        <div class="sidebar__title">مؤسسة نهضة</div>
        <div class="sidebar__title">بني سويف</div>
        <div class="sidebar__subtitle">المشهرة برقم 1079 لسنة 2009</div>
      </div>
    </div>
    <button class="sidebar__toggle" aria-label="طي الشريط الجانبي" title="طي الشريط الجانبي">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(180deg);">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
  </div>

  <nav class="sidebar__nav">
    <!-- Accordion Item 1: الرئيسية -->
    <div class="accordion-group">
      <button class="accordion-header accordion-header--active" data-view-target="dashboard" id="nav-dashboard-link"
        type="button">
        <div class="accordion-header__content">
          <svg class="accordion-header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          </svg>
          <span class="accordion-header__title">الرئيسية</span>
        </div>
      </button>
    </div>

    <!-- Accordion Item 2: إدارة البيانات -->
    <div class="accordion-group">
      <button class="accordion-header">
        <div class="accordion-header__content">
          <svg class="accordion-header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="accordion-header__title">إدارة البيانات</span>
        </div>
        <svg class="accordion-header__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="accordion-body">
        <a href="#" class="sidebar-sublink" data-view-target="personal-data">البيانات الأساسية</a>
        <a href="#" class="sidebar-sublink" data-view-target="state-mgmt">إدارة بيانات الحالة</a>
        <a href="#" class="sidebar-sublink" id="nav-charities-link" data-view-target="charities">إدارة الجمعيات</a>
      </div>
    </div>

    <!-- Accordion Item: الموظفين (خاص بالمدير والإدارة) -->
    <div class="accordion-group" id="sidebar-employees-group" style="display: none;">
      <button class="accordion-header" data-view-target="employees" id="nav-employees-link" type="button">
        <div class="accordion-header__content">
          <svg class="accordion-header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span class="accordion-header__title">الموظفين</span>
        </div>
      </button>
    </div>

    <!-- Accordion Item: تقارير (خاص بالمدير / الأدمن) -->
    <div class="accordion-group" id="sidebar-reports-group" style="display: none;">
      <button class="accordion-header" data-view-target="reports" id="nav-reports-link" type="button">
        <div class="accordion-header__content">
          <svg class="accordion-header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span class="accordion-header__title">تقارير</span>
        </div>
      </button>
    </div>

    <!-- Accordion Item: فلترة الحالات حسب الجمعية والدعم (خاص بالمدير) -->
    <div class="accordion-group" id="sidebar-case-support-filter-group" style="display: none;">
      <button class="accordion-header" data-view-target="case-support-filter" id="nav-case-support-filter-link" type="button">
        <div class="accordion-header__content">
          <svg class="accordion-header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          <span class="accordion-header__title">فلترة الحالات بالدعم</span>
        </div>
      </button>
    </div>

    <!-- Accordion Item 3: إعدادات النظام -->
    <div class="accordion-group">
      <button class="accordion-header">
        <div class="accordion-header__content">
          <svg class="accordion-header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
          <span class="accordion-header__title">إعدادات النظام</span>
        </div>
        <svg class="accordion-header__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="accordion-body">
        <a href="#" class="sidebar-sublink" id="nav-bg-card-link" data-view-target="bg-studio">استوديو التحكم
          بالخلفية</a>
      </div>
    </div>

    <!-- Partner Logos: shown just above the logout button -->
    <div class="sidebar__partners" style="margin-top: auto;">
      <div class="sidebar__partner">
        <img src="assets/devx_logo.jpg" alt="DevX" class="sidebar__partner-logo">
        <span class="sidebar__partner-name">DevX</span>
      </div>
      <span class="sidebar__partners-amp">&amp;</span>
      <div class="sidebar__partner">
        <img src="assets/delmon_logo.jpeg" alt="Delmon" class="sidebar__partner-logo sidebar__partner-logo--round">
        <span class="sidebar__partner-name">Delmon</span>
      </div>
    </div>

    <!-- Accordion Item 4: تسجيل الخروج (Last Button in Sidebar) -->
    <div class="accordion-group">
      <button class="accordion-header accordion-header--logout" data-view-target="login" id="nav-logout-link" title="تسجيل الخروج" aria-label="تسجيل الخروج" type="button">
        <div class="accordion-header__content">
          <svg class="accordion-header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span class="accordion-header__title">تسجيل الخروج</span>
        </div>
      </button>
    </div>
  </nav>

  <!-- Sidebar Footer Profile -->
  <div class="sidebar__footer" data-view-target="profile" style="cursor: pointer;" title="تعديل الملف الشخصي">
    <div class="user-avatar">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80"
        alt="حسن" class="user-avatar-img" id="sidebar-user-avatar">
    </div>
    <div class="user-info">
      <span class="user-name" id="sidebar-user-name">حسن</span>
      <span class="user-role" id="sidebar-user-role">مدخل بيانات</span>
    </div>
  </div>
</aside>
