<!-- 1. Hero Welcome Header Glass Card -->
<div class="glass-card dash-hero-card" style="padding: 22px 28px; margin-bottom: 24px;">
  <div class="dash-hero-card__main">
    <div class="dash-hero-card__avatar">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80"
        alt="محمد أحمد" class="dash-user-avatar-img">
    </div>
    <div class="dash-hero-card__info">
      <h1 class="dash-hero-card__title" style="font-size: 25px; font-weight: 800; color: #000000; margin: 0;">
        <span class="dash-hero-card__greeting">صباح الخير</span>، <span class="dash-hero-card__name">محمد أحمد</span></h1>
      <p class="dash-hero-card__desc"
        style="font-size: var(--font-size-xs); color: var(--text-secondary); margin: 4px 0 0;">مرحباً بك في
        لوحة تحكم منظومة النهضة</p>
    </div>
  </div>

  <div class="dash-hero-card__meta" style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">

    <div class="dash-hero-card__date"
      style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(255, 255, 255, 0.6); border-radius: 12px; border: 1px solid var(--border-color); font-size: var(--font-size-xs); font-weight: 800;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span id="dash-current-date">الثلاثاء، 11 أغسطس 2026</span>
    </div>
  </div>
</div>
