<!-- 2. Central Multi-Criteria Search -->
<div class="dash-search-standalone">
  <div class="dash-search-standalone__header">
    <h2 class="dash-search-standalone__title">البحث والاستعلام عن الحالات</h2>
    <p class="dash-search-standalone__subtitle">استعلام فوري بالاسم، الرقم القومي، رقم الهاتف، الجمعية، المركز والقرية أو تاريخ التسجيل</p>
  </div>

  <!-- Search Input + Button Row -->
  <div class="dash-search-body dash-search-standalone__body">
    <!-- Mode 1 & 2: Text / Number Input Field -->
    <div class="dash-search-input-box" id="search-box-text">
      <div class="dash-search-input-wrapper">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="dash-search-input" class="dash-search-input" aria-label="بحث بالرقم القومي"
          placeholder="أدخل الرقم القومي (14 رقم)..." maxlength="14" dir="rtl">
        <span id="dash-search-counter" class="dash-search-counter" style="display: none;"></span>
      </div>
      <div id="dash-search-hint" class="dash-search-hint" style="display: none;"></div>
    </div>

    <!-- Mode 3: Charity Dropdown Select Menu -->
    <div class="dash-search-input-box dash-search-input-box--hidden" id="search-box-charity">
      <div class="dash-search-select-wrapper">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 21h18"></path>
          <path d="M5 21V7l8-4v18"></path>
          <path d="M19 21V11l-6-3"></path>
        </svg>
        <select id="dash-charity-select" class="dash-search-select" aria-label="اختيار الجمعية" dir="rtl">
          <option value="" selected>اختر الجمعية لعرض الحالات</option>
          <option value="nahda_bs">جمعية النهضة للتنمية والتطوير — بني سويف</option>
          <option value="khair_fashn">جمعية الخير والإحسان — الفشن</option>
          <option value="amal_naser">جمعية الأمل لرعاية الأيتام — ناصر</option>
          <option value="mustaqbal_biba">جمعية المستقبل الساطع — ببا</option>
          <option value="resala_bs">جمعية رسالة للأعمال الخيرية — بني سويف</option>
          <option value="takaful_somasta">جمعية التكافل الاجتماعي — سمسطا</option>
          <option value="أخرى" data-is-other="true">أخرى</option>
        </select>
        <svg class="select-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <input type="text" id="dash-charity-select-other" class="dash-search-input other-input-field" aria-label="اسم الجمعية"
        data-for="dash-charity-select" dir="rtl" placeholder="أدخل اسم الجمعية..."
        style="display: none; margin-top: 10px;">
    </div>

    <!-- Mode 4: Region Search (المركز والقرية) with Autocomplete -->
    <div class="dash-search-input-box dash-search-input-box--hidden" id="search-box-region" style="position: relative;">
      <div class="dash-search-input-wrapper">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <input type="text" id="dash-region-input" class="dash-search-input" aria-label="بحث بالمركز أو القرية"
          placeholder="ابحث بالمركز أو القرية (مثال: الواسطى، إبشنا)..."
          dir="rtl" autocomplete="off">
      </div>
      <div id="dash-region-suggestions" class="search-autocomplete-dropdown" style="display: none;"></div>
    </div>

    <!-- Mode 5: Date Range Search (النطاق الزمني) -->
    <div class="dash-search-input-box dash-search-input-box--hidden" id="search-box-date">
      <div class="dash-date-range-container">
        <div class="dash-date-fields-group">
          <div class="dash-date-field">
            <span class="dash-date-label" id="dash-date-from-label">من:</span>
            <div class="dash-search-input-wrapper">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <input type="date" id="dash-date-from" aria-labelledby="dash-date-from-label" class="dash-search-input dash-search-input--date" dir="rtl">
            </div>
          </div>

          <div class="dash-date-field">
            <span class="dash-date-label" id="dash-date-to-label">إلى:</span>
            <div class="dash-search-input-wrapper">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <input type="date" id="dash-date-to" aria-labelledby="dash-date-to-label" class="dash-search-input dash-search-input--date" dir="rtl">
            </div>
          </div>
        </div>

        <!-- Quick Presets -->
        <div class="dash-date-presets">
          <button type="button" class="btn-date-preset" data-preset="today">اليوم</button>
          <button type="button" class="btn-date-preset" data-preset="week">آخر 7 أيام</button>
          <button type="button" class="btn-date-preset" data-preset="month">آخر 30 يوم</button>
          <button type="button" class="btn-date-preset" data-preset="year">هذا العام</button>
        </div>
      </div>
    </div>

    <!-- Search Execute Button -->
    <button type="button" class="btn btn--primary dash-search-btn" id="btn-dash-search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>بحث</span>
    </button>
  </div>

  <!-- 6 Search Mode Criteria Tabs Switcher -->
  <div class="dash-search-tabs dash-search-tabs--under" role="tablist">
    <button class="dash-search-tab" data-search-mode="name" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>الاسم</span>
    </button>

    <button class="dash-search-tab dash-search-tab--active" data-search-mode="nid" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <circle cx="9" cy="10" r="2"></circle>
        <line x1="15" y1="8" x2="17" y2="8"></line>
        <line x1="15" y1="12" x2="17" y2="12"></line>
        <line x1="7" y1="16" x2="17" y2="16"></line>
      </svg>
      <span>الرقم القومي (14 رقم)</span>
    </button>

    <button class="dash-search-tab" data-search-mode="phone" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path
          d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
        </path>
      </svg>
      <span>رقم الهاتف</span>
    </button>

    <button class="dash-search-tab" data-search-mode="charity" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 21h18"></path>
        <path d="M5 21V7l8-4v18"></path>
        <path d="M19 21V11l-6-3"></path>
      </svg>
      <span>الجمعية</span>
    </button>

    <button class="dash-search-tab" data-search-mode="region" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      <span>المركز أو القرية</span>
    </button>

    <button class="dash-search-tab" data-search-mode="date" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>تاريخ التسجيل</span>
    </button>
  </div>

  <!-- Dynamic Results Section (Scenario 1) -->
  <div class="dash-search-results dash-search-results--hidden" id="dash-search-results">
    <div class="dash-results-toolbar">
      <div class="dash-results-summary">
        <h3 class="dash-results-title" id="dash-results-title">نتائج البحث</h3>
        <span class="dash-results-count" id="dash-results-count"></span>
      </div>
      <button type="button" class="btn btn--secondary btn--sm dash-results-clear-btn" id="btn-clear-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>إلغاء البحث والعودة</span>
      </button>
    </div>
    <div class="dash-results-list" id="dash-results-list">
      <!-- Dynamically populated search response -->
    </div>
  </div>
</div>
