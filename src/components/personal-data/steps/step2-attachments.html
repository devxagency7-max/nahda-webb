<!-- TAB 2: المرفقات والمستندات -->
<div class="step-pane" id="step-pane-2" style="display: none;">
  <section class="glass-card" id="card-tab-2">
    <div class="glass-card__header">
      <div class="glass-card__title-group">
        <div class="glass-card__icon" style="background: rgba(37, 99, 235, 0.15); color: #2563eb;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
        </div>
        <div>
          <h2 class="glass-card__title">2. المستندات والمرفقات والأرشيف</h2>
          <p class="glass-card__subtitle">رفع وصور بطاقات الرقم القومي والأوراق الرسمية وصور السكن</p>
        </div>
      </div>
    </div>

    <div class="form-grid form-grid--2-col" style="margin-bottom: 16px;">
      <div class="form-group form-group--full">
        <label class="form-label" for="case-doc-type"><span>تصنيف نوع المستند / الصورة</span> <span
            class="form-label__required">*</span></label>
        <div class="form-select-wrapper">
          <!-- القيم = أكواد قايمة السيرفر المقفولة (نفس الموبايل). «أخرى» مالهاش
               كتابة جوه القايمة: تفاصيلها في خانة الوصف تحت وبتتبعت description. -->
          <select id="case-doc-type" class="form-select" data-no-other="true">
            <option value="" selected disabled>اختر تصنيف المستند المراد إرفاقه...</option>
            <option value="national_id">بطاقة شخصية</option>
            <option value="family_docs">مستندات الأسرة (شهادات ميلاد/زواج/وفاة)</option>
            <option value="income_docs">مستندات دخل ومعاشات</option>
            <option value="medical_docs">مستندات علاج وتقارير طبية</option>
            <option value="education_docs">مستندات تعليم وإيصالات سداد</option>
            <option value="housing_photos">صور السكن والمبنى</option>
            <option value="field_photos">صور الزيارة الميدانية</option>
            <option value="other">أخرى</option>
          </select>
          <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
      <div class="form-group form-group--full" id="case-doc-description-group" style="display: none;">
        <label class="form-label" for="case-doc-description"><span>تفاصيل المستند (اختياري)</span></label>
        <input type="text" id="case-doc-description" class="form-input" maxlength="300"
          placeholder="اكتب اسم أو وصف المستند...">
      </div>
    </div>

    <div class="form-grid form-grid--full">
      <label class="form-upload">
        <input type="file" id="case-doc-upload" style="display: none;" multiple
          accept="image/jpeg,image/png,image/heic,image/heif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.heic,.heif,.doc,.docx">
        <div class="form-upload__icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </div>
        <div class="form-upload__title">اضغط هنا لإرفاق مستندات أو صور جديدة للحالة</div>
        <div class="form-upload__hint">صور (JPG, PNG, HEIC, WebP) أو PDF أو ملف Word — لحد 5 ملفات في المرة بنفس التصنيف، وحجم الملف الواحد لحد <span id="case-doc-size-limit">20</span> ميجابايت</div>
      </label>
    </div>

    <div class="form-grid form-grid--full" style="margin-top: 16px;">
      <div class="case-page-attachments" id="attachments-list">
        <div class="case-page-att-item" id="attachments-empty-state" style="justify-content: center; color: var(--text-muted);">
          لسه مفيش مستندات مرفوعة — اختَر تصنيف المستند فوق وابدأ الرفع.
        </div>
      </div>
    </div>
  </section>
</div>
