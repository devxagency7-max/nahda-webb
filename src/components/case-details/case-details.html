      <div>
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
          <span class="badge" style="background: rgba(37, 99, 235, 0.15); color: #2563eb; font-weight: 800; font-size: 14px;" id="case-detail-code">CASE-101</span>

        <button type="button" class="btn btn--secondary" data-view-target="all-cases" style="font-weight: 700;">

      </div>
    </div>

  <!-- Full 10 Glassmorphic Cards Stack Container -->

  <!-- أزرار الإجراء العائمة — تُبنى حسب دور المستخدم وحالة الملف -->
  <div class="case-float-actions" id="case-float-actions"></div>

</div>
