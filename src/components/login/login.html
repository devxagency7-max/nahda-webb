<div class="page-view" id="view-login">
  <div class="login-page-wrapper">
    <div class="glass-card login-card">
      <div class="login-card__header">
        <div class="login-card__brand">
          <img src="assets/logo.png" alt="شعار مؤسسة النهضة" class="login-card__logo">
        </div>
        <h1 class="login-card__title">مؤسسه نهضة بني سويف</h1>
        <p class="login-card__subtitle">المشهرة برقم 1079 لسنة 2009</p>
        <p class="login-card__subtitle">منظومة إدارة الحالات الاجتماعية والدعم الخيري الرقمية</p>
      </div>

      <form id="login-form">
        <!-- Username / Email Input -->
        <div class="login-field-group">
          <label for="login-username" class="login-label">اسم المستخدم أو البريد الإلكتروني</label>
          <div class="login-input-wrapper">
            <svg class="login-input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="login-username" class="login-input" placeholder="ادخل البريد الإلكتروني..." required>
          </div>
        </div>

        <!-- Password Input -->
        <div class="login-field-group">
          <label for="login-password" class="login-label">كلمة المرور السرية</label>
          <div class="login-input-wrapper">
            <svg class="login-input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="login-password" class="login-input" required>
            <button type="button" class="login-toggle-pw" id="btn-toggle-pw" title="إظهار/إخفاء كلمة المرور" aria-label="إظهار/إخفاء كلمة المرور">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Partner Logos -->
        <div class="login-partners">
          <div class="login-partner">
            <img src="assets/devx_logo.jpg" alt="DevX" class="login-partner__logo">
            <span class="login-partner__name">DevX</span>
          </div>
          <span class="login-partners__amp">&amp;</span>
          <div class="login-partner">
            <img src="assets/delmon_logo.jpeg" alt="Delmon" class="login-partner__logo login-partner__logo--round">
            <span class="login-partner__name">Delmon</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-login-submit" class="login-submit-btn" style="margin-top: 10px;">
          <span>تسجيل الدخول</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
      </form>

    </div>
  </div>
</div>
