# nginx server block for the Nahda web frontend.
#
# This file is an envsubst TEMPLATE: the Dockerfile copies it to
# /etc/nginx/templates/default.conf.template and the nginx image renders it into
# /etc/nginx/conf.d/default.conf at container start, filling in ${API_UPSTREAM}.
# (To use it on a bare nginx host, replace ${API_UPSTREAM} by hand and drop it in conf.d/.)
#
# WHY THE PROXY: the backend does not send CORS headers. The browser therefore must only
# ever talk to ITS OWN origin (`/api/v1/...`, see VITE_API_BASE_URL) and nginx forwards
# those calls server-to-server, where CORS does not exist. No Access-Control-* needed.
#
#   API_UPSTREAM  origin of the backend, scheme + host [+ port], NO path, NO trailing slash
#                 e.g. https://srv1990155.hstgr.cloud

# Cache policy per URL (http-level `map` is valid here: conf.d is included inside `http {}`).
#  - Vite's content-hashed bundles never change under the same name -> cache for a year.
#  - index.html (and "/") must always be revalidated or users stay pinned to an old bundle.
#  - /api/ responses are per-user and authenticated -> never stored by anyone.
#  - Everything else (public/assets images, unhashed) -> a day.
map $uri $nahda_cache_control {
    default                                              "public, max-age=86400";
    ~^/api/                                              "no-store";
    "~^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css)$"         "public, max-age=31536000, immutable";
    /                                                    "no-cache";
    /index.html                                          "no-cache";
}

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ---- compression ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- security headers ----------------------------------------------------------
    # Declared once at server level and NOT inside any `location` (an add_header inside a
    # location silently discards every add_header inherited from the server block).
    #
    # connect-src allows https: because attachment/avatar uploads PUT straight to
    # object-storage presigned URLs on a different origin. Once you know that origin,
    # replace `https:` with it (e.g. https://s3.example.com) for a tighter policy.
    # style-src needs 'unsafe-inline' while the JS templates still emit style="..." (LOW-010).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $nahda_cache_control always;

    # ---- API reverse proxy ---------------------------------------------------------
    # No URI part in proxy_pass => the request path (/api/v1/...) is forwarded unchanged.
    location /api/ {
        proxy_pass ${API_UPSTREAM};

        # HTTPS upstream: send SNI and verify its certificate (the Host header defaults to
        # $proxy_host, i.e. the upstream host, which name-based virtual hosts require).
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        # Let's Encrypt's current chain is 4 certs deep; nginx's default depth (1) rejects it.
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # One Cache-Control only: ours ("no-store", from the map above), not the backend's.
        proxy_hide_header Cache-Control;

        # Never cache authenticated API responses at the edge.
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # CSV report export can run long (client timeout is 120 s, see .env.example).
        proxy_connect_timeout 10s;
        proxy_send_timeout    130s;
        proxy_read_timeout    130s;

        client_max_body_size 10m;
    }

    # ---- static SPA ----------------------------------------------------------------
    # The app has no URL routing, so no history-API fallback is needed; unknown paths are 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Liveness probe for Docker / the orchestrator.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
