# Security + cache headers live in public/_headers (Netlify reads it from the publish dir).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "/api/v1"

# Same-origin API proxy: the backend sends no CORS headers, so the browser must only call
# its own origin. status = 200 makes this a rewrite (proxy), not a redirect.
[[redirects]]
  from = "/api/*"
  to = "https://srv1990155.hstgr.cloud/api/:splat"
  status = 200
  force = true
